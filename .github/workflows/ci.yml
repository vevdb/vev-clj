name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Clojure and Java 21
    runs-on: ubuntu-24.04
    steps:
      - name: Check out vev-clj
        uses: actions/checkout@v4
        with:
          path: vev-clj
      - name: Check out vev-java
        uses: actions/checkout@v4
        with:
          repository: vevdb/vev-java
          path: vev-java
          fetch-depth: 0
      - name: Select matching Java client branch when available
        if: github.head_ref != ''
        working-directory: vev-java
        env:
          SIBLING_BRANCH: ${{ github.head_ref }}
        run: |
          if git ls-remote --exit-code origin "refs/heads/$SIBLING_BRANCH" >/dev/null 2>&1; then
            git fetch origin "refs/heads/$SIBLING_BRANCH"
            git checkout --detach FETCH_HEAD
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - name: Install the sibling Java source artifact
        working-directory: vev-java
        run: mvn --batch-mode --no-transfer-progress install
      - name: Resolve and load the Clojure API
        working-directory: vev-clj
        run: |
          clojure -P
          clojure -M:dev -e "(require 'vev.core)"
      - name: Build the Clojure jar
        working-directory: vev-clj
        run: mvn --batch-mode --no-transfer-progress verify
